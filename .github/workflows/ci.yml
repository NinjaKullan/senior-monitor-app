name: CI

# Both suites on every push to main. The product suite needs a real Postgres —
# RLS and the grant migrations cannot be tested against anything else — so CI
# provides one and sets KETTLE_REQUIRE_POSTGRES, which turns the local "no
# database, skip" fallback into a hard failure. A green CI run is a run that
# actually executed both suites.
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kettle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Same throwaway credentials the test default expects; the service
      # container is destroyed with the job.
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kettle_test
      KETTLE_REQUIRE_POSTGRES: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r product/requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test (pilot + product)
        run: pytest

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # No access log: URLs here are harmless, but the habit is the point — the
    # rest of this system deliberately does not log request lines either.
    access_log off;

    # Single-page app: unknown paths are routes, not 404s. The magic-link
    # callback lands on one of them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /healthz {
        add_header Content-Type application/json;
        return 200 '{"ok":true}';
    }

    location ~* \.(js|css|png|svg|webmanifest)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # No access log: URLs here are harmless, but the habit is the point — the
    # rest of this system deliberately does not log request lines either.
    access_log off;

    # Caching (QUESTIONS 112). The SPA shell must never be cached: deploys
    # rename the hashed assets, so a heuristically-cached index.html 404s its
    # own JavaScript and renders a blank white page with no error — which a
    # parent reads as "it broke". `no-cache` means revalidate-before-use, and
    # the shell is small enough that the revalidation costs nothing. Hashed
    # assets are the opposite case: the name changes when the bytes do, so a
    # year + immutable is safe by construction.
    #
    # There is deliberately no service worker in this app — HTTP caching is the
    # entire update story. If one is ever added it brings this same failure
    # class back with worse persistence, and must ship its own update flow.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths are routes, not 404s. The magic-link
    # callback lands on one of them. Everything here — the shell, the manifest,
    # the unhashed icons — revalidates before use, for the same reason the
    # shell does: none of it carries a content hash in its name.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Experiment §5.1 (QUESTIONS 102): one signed rehearsal .shortcut at an
    # unguessable path, served so iOS hands it to Shortcuts instead of showing
    # bytes. The content type IS the experiment's variable — this line is the
    # one to change between attempts. First guess: application/x-shortcut.
    # Fallbacks to try in order if Safari downloads instead of opening the Add
    # Shortcut sheet: application/octet-stream (forces the "Open in..." path),
    # then application/x-apple-shortcut. Staged by scripts/stage_shortcut.py;
    # no-store because a revoked rehearsal link must die when the file does.
    location /x/ {
        types { }
        default_type application/x-shortcut;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location /healthz {
        add_header Content-Type application/json;
        return 200 '{"ok":true}';
    }
}

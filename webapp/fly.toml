# fly.toml app configuration file generated for kettle-app on 2026-07-31T22:11:09-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kettle-app'
primary_region = 'sin'

[build]
  # Public values, baked into the static bundle at image build time. A bare
  # `fly deploy` without these produces a login page that talks to nowhere
  # (field-discovered 2026-08-16). The service key must NEVER appear here.
  [build.args]
    VITE_SUPABASE_URL = "https://azeyrlfscgbqbvzhdtie.supabase.co"
    VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_rRh6BZQncewqysZYRehXeQ_yjWvQX36"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '5s'
    method = 'GET'
    path = '/healthz'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256

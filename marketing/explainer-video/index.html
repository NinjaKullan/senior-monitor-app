<!doctype html>
<meta charset="utf-8">
<title>Kettle explainer</title>
<style>
  @font-face { font-family: Patrick; src: url("../../tools/social/fonts/PatrickHand-Regular.ttf"); }
  html, body { margin: 0; background: #F7F1E8; }
  canvas { display: block; }
</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
// Every frame is a pure function of its index: seeded noise only, no clock.
// Backdrops are still paintings in assets/ (made once by paint.mjs); everything that moves is drawn here.
const W = 1080, H = 1920, FPS = 30, FRAMES = 30 * FPS;
const PAPER = '#F7F1E8', INK = '#403C36', GREEN = '#297A5C', GREY = '#C9D3C6', YELLOW = '#E8C77A';
const NIGHT = '#1F3B3B';                              // dark phone glass; dawn wash over Mom's house
const SAFE_TOP = H * 0.12, SAFE_BOTTOM = H * 0.88;    // TikTok / Reels app chrome covers the rest

const main = document.getElementById('c');
const off = document.createElement('canvas'); off.width = W; off.height = H;
let ctx = main.getContext('2d');

// ---------- deterministic helpers ----------
function hash(str) { let h = 2166136261; for (const ch of String(str)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let s = hash(seed) || 1; return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const io = x => { x = clamp01(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const seg = (t, a, b) => io((t - a) / (b - a));      // eased 0..1 between times a and b
const lerp = (a, b, k) => a + (b - a) * k;

// ---------- paper primitives ----------
const rect = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
function arc(cx, cy, rx, ry, a0, a1, n = 20) { const p = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; p.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); } return p; }
function ell(cx, cy, rx, ry, n = 36) { return arc(cx, cy, rx, ry, 0, Math.PI * 2, n).slice(0, n); }

// Jitter a polygon's edges so it reads as torn paper. Same key, same tear, every frame.
function torn(pts, key, amp, step) {
  const r = rng(key), out = [];
  for (let i = 0; i < pts.length; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[(i + 1) % pts.length];
    const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy);
    if (len < 1) continue;
    const n = Math.max(1, Math.round(len / step)), nx = -dy / len, ny = dx / len;
    for (let j = 0; j < n; j++) { const k = j / n, w = (r() - .5) * 2 * amp; out.push([x0 + dx * k + nx * w, y0 + dy * k + ny * w]); }
  }
  return out;
}
function piece(pts, fill, key, o = {}) {
  const p = torn(pts, key, o.amp ?? 3, o.step ?? 14);
  ctx.save();
  if (o.shadow !== false) { ctx.shadowColor = o.shadowColor || 'rgba(201,211,198,0.9)'; ctx.shadowBlur = 10; ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 7; }
  ctx.globalAlpha *= o.alpha ?? 1;
  ctx.fillStyle = fill; ctx.beginPath();
  p.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function ink(fn, w = 6, color = INK) { ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); fn(); ctx.stroke(); ctx.restore(); }
function glow(x, y, r, a) {
  if (a <= 0) return;
  ctx.save(); const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(232,199,122,${a})`); g.addColorStop(1, 'rgba(232,199,122,0)');
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); ctx.restore();
}
function fill(color) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = color; ctx.fillRect(0, 0, W, H); ctx.restore(); }

// Paper grain, generated once from a fixed seed and overlaid on every frame.
const grain = document.createElement('canvas'); grain.width = W; grain.height = H;
{ const g = grain.getContext('2d'), r = rng('grain'), img = g.createImageData(W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) { d[i] = d[i + 1] = d[i + 2] = 128 + (r() - .5) * 110 | 0; d[i + 3] = 255; }
  g.putImageData(img, 0, 0); }

// ---------- words ----------
// One caption at a time, ink, centred, >= 72px, inside the middle 76%. Violations throw so a render fails loudly.
function words(text, y, o = {}) {
  const size = o.size ?? 84, maxW = 920, lh = size * 1.18;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.font = `${size}px Patrick`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const rows = [];
  for (const para of text.split('\n')) { let line = '';
    for (const w of para.split(' ')) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { rows.push(line); line = w; } else line = t; }
    rows.push(line); }
  const top = y - (rows.length - 1) * lh / 2, bottom = top + (rows.length - 1) * lh;
  if (size < 72) throw new Error('words: too small: ' + text);
  if (top - size * .6 < SAFE_TOP || bottom + size * .6 > SAFE_BOTTOM) throw new Error('words: outside safe zone: ' + text);
  for (const r of rows) if (ctx.measureText(r).width > maxW) throw new Error('words: too wide: ' + r);
  const a = o.alpha ?? 1;
  if (a > 0) {
    ctx.globalAlpha = a;
    ctx.fillStyle = INK; rows.forEach((r, i) => ctx.fillText(r, W / 2, top + i * lh));
  }
  ctx.restore();
}

// ---------- props ----------
function phone(x, y, a, s, lit) {           // a plain lit rectangle, nothing on the screen
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(s, s);
  glow(0, 0, 220, lit * .35);
  piece(rect(-40, -76, 80, 152), INK, 'phone-body', { amp: 1.5, step: 10 });
  piece(rect(-31, -64, 62, 128), NIGHT, 'phone-screen', { amp: 1, step: 10, shadow: false });   // off: dark glass
  piece(rect(-31, -64, 62, 128), YELLOW, 'phone-screen', { amp: 1, step: 10, shadow: false, alpha: lit });
  ctx.restore();
}
function steam(x, y, t, amount, s = 1, color = PAPER) {    // three paper wisps rising from the spout tip
  if (amount <= 0) return;
  for (let i = 0; i < 3; i++) {
    const ph = (t * .32 + i / 3) % 1, a = Math.sin(ph * Math.PI) * .8 * amount;
    const wx = x + s * (Math.sin(ph * 5 + i * 2) * 22 + i * 6), wy = y - s * (20 + ph * 170), r = s * (14 + ph * 22);
    piece(ell(wx, wy, r * 1.25, r, 20), color, 'steam' + i, { amp: 2, step: 8, alpha: a });
  }
}
// ---------- backdrops ----------
const IMG = {};
const loaded = Promise.all(['apartment-night', 'mom-house', 'kitchen', 'map', 'apartment-dawn', 'kettle'].map(n => new Promise((ok, fail) => {
  const im = new Image(); im.onload = () => ok(IMG[n] = im); im.onerror = () => fail(new Error('missing assets/' + n + '.png')); im.src = 'assets/' + n + '.png';
})));
// Slow push-in: zoom z centred on (cx, cy) for everything fn draws.
function camera(z, cx, cy, fn) { ctx.save(); ctx.translate(cx, cy); ctx.scale(z, z); ctx.translate(-cx, -cy); fn(); ctx.restore(); }
const backdrop = (name, z = 1, cx = W / 2, cy = H / 2) => camera(z, cx, cy, () => ctx.drawImage(IMG[name], 0, 0));

// A phone lying on a table, seen from a little above. Once lit, a blank paper slip settles on the screen:
// the calm card. No words, numbers, icons or badges on it, ever.
function tablePhone(x, y, lit, card) {
  ctx.save(); ctx.translate(x, y); ctx.scale(1.4, 1.4 * .62);
  phone(0, 0, -.08, 1.05, lit);
  ctx.rotate(-.08); ctx.scale(1.05, 1.05);
  piece(rect(-24, -24 + (1 - card) * 14, 48, 34), PAPER, 'card', { amp: 1.2, step: 8, alpha: card, shadowColor: 'rgba(64,60,54,0.25)' });
  ctx.restore();
}

// ---------- the travelling light (map coordinates = screen) ----------
const ROUTE = [[800, 960], [820, 1180], [420, 1120], [258, 1262]];   // Mom's door to the top of the kid's building
function bez(p, k) { const [a, b, c, d] = p, m = 1 - k; return [0, 1].map(i => m * m * m * a[i] + 3 * m * m * k * b[i] + 3 * m * k * k * c[i] + k * k * k * d[i]); }

// ---------- scenes ----------
function scene1(t) {     // night at the kid's apartment: cozy lamp, city lights, phone resting on the table
  backdrop('apartment-night', lerp(1, 1.04, seg(t, 0, 6.6)), 540, 1100);
  tablePhone(760, 1560, 0, 0);
  words("Is Mom's day starting okay?", 330, { alpha: seg(t, .8, 1.6) });
}
function scene2house(t) {  // morning comes at Mom's house; her kitchen light turns on
  camera(lerp(1, 1.08, seg(t, 5.4, 10.2)), 655, 1100, () => {
    backdrop('mom-house');
    const on = seg(t, 7.6, 8.6);
    glow(655, 1245, 260, on * .55);
    piece(rect(598, 1190, 114, 112), YELLOW, 'mom-window', { amp: 1.2, step: 10, shadow: false, alpha: on });
  });
  ctx.save(); ctx.globalAlpha = lerp(.3, 0, seg(t, 6, 8.4)); fill(NIGHT); ctx.restore();
}
function scene2kitchen(t) {  // inside: the kettle steams, her phone on the counter lights up
  camera(lerp(1, 1.03, seg(t, 9, 12.6)), 700, 1050, () => {
    backdrop('kitchen');
    steam(994, 1056, t, seg(t, 9.8, 10.8), .9, GREY);   // paper steam vanishes on the paper wall
    phone(300, 1082, -.1, .9, seg(t, 10.2, 10.7));
  });
}
function scene3(t) {     // a small warm light travels the dotted path to the kid's city
  backdrop('map');
  ctx.save(); ctx.globalAlpha = seg(t, 11.6, 12.6); ctx.setLineDash([0, 28]);
  ink(() => { ctx.moveTo(...ROUTE[0]); ctx.bezierCurveTo(...ROUTE[1], ...ROUTE[2], ...ROUTE[3]); }, 11, 'rgba(64,60,54,0.5)'); ctx.restore();
  const k = seg(t, 12.8, 17.4), arrive = seg(t, 17.2, 18);
  glow(...ROUTE[3], 200, arrive * .6);
  if (k > 0 && arrive < 1) { const [x, y] = bez(ROUTE, k); glow(x, y, 70, .7 * (1 - arrive)); piece(ell(x, y, 17, 17, 14), YELLOW, 'dot', { amp: 1.2, step: 6, alpha: 1 - arrive }); }
  words("Mom's normal\nmorning happened.", 400, { alpha: seg(t, 13.4, 14.2) });
}
function scene4(t) {     // the kid's phone lights up with a calm card
  backdrop('apartment-dawn', lerp(1.04, 1, seg(t, 18.4, 25.6)), 540, 1100);
  tablePhone(760, 1560, seg(t, 19.6, 20.4), seg(t, 20.2, 21));
  words("No call needed. Just a short note, twice a day.", 326, { size: 78, alpha: seg(t, 20.6, 21.4) });
}
function scene5(t) {     // the kettle, the name, the line
  fill(PAPER);
  const k = seg(t, 24.6, 25.8);   // starts inside the crossfade so no empty paper beat
  // Painted brand kettle (assets/kettle.png, 660x600, transparent). Spout tip sits at (250, -85) from its centre.
  const s = lerp(.7, .85, k), K = IMG.kettle;
  ctx.save(); ctx.globalAlpha = k; ctx.drawImage(K, 540 - K.width * s / 2, 740 - K.height * s / 2, K.width * s, K.height * s); ctx.restore();
  steam(540 + 250 * s, 740 - 85 * s, t, seg(t, 26, 27), 1.4, GREY);
  words('Kettle', 1160, { size: 150, alpha: seg(t, 26.4, 27.2) });
  words('heykettle.com', 1300, { size: 80, alpha: seg(t, 26.4, 27.2) });
  words('For checking in,\nnot checking up.', 1520, { alpha: seg(t, 27.6, 28.4) });
}
const SCENES = [[0, scene1], [6, scene2house], [9.6, scene2kitchen], [12, scene3], [19, scene4], [25, scene5]];
const XFADE = .6;

function draw(fn, t, c) { ctx = c.getContext('2d'); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; fn(t); }
function renderFrame(n) {
  const t = n / FPS;
  let i = SCENES.length - 1; while (i > 0 && t < SCENES[i][0]) i--;
  draw(SCENES[i][1], t, main);
  const next = SCENES[i + 1];
  if (next && t > next[0] - XFADE) {   // gentle crossfade into the next scene
    draw(next[1], t, off);
    ctx = main.getContext('2d'); ctx.globalAlpha = seg(t, next[0] - XFADE, next[0]); ctx.drawImage(off, 0, 0);
  }
  ctx.globalAlpha = .16; ctx.globalCompositeOperation = 'overlay'; ctx.drawImage(grain, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}
window.FRAMES = FRAMES;
window.frame = n => { renderFrame(n); return main.toDataURL('image/png'); };
Promise.all([document.fonts.load('84px Patrick'), loaded]).then(() => {
  if (![...document.fonts].some(f => f.family === 'Patrick' && f.status === 'loaded')) throw new Error('Patrick Hand did not load');
  renderFrame(0);
  window.__ready = true;
});
</script>

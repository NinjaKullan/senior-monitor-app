[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "C4", "SIM"]

[tool.ruff.lint.isort]
# `app` is the pilot; `kettle`/`scripts`/`testsupport` are the product backend,
# which lives under product/ and is imported by name.
known-first-party = ["app", "tests", "kettle", "scripts", "testsupport"]

[tool.pytest.ini_options]
# `tests` is the pilot (SQLite, no services needed); `product/tests` is the
# product backend and needs a Postgres — it skips itself when none is reachable.
testpaths = ["tests", "product/tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# -rs prints skip reasons in the summary. Without it a run that skipped the whole
# product suite for want of a Postgres just says "56 skipped", which reads as
# green. The reason says, in words, that it is not.
addopts = "-rs"

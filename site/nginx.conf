# The old Fly hostname forwards rather than serving a second copy of the page
# (DECISIONS 142). heykettle.com is the canonical origin now; a page reachable at
# two addresses is two pages as far as a search engine is concerned, and the
# canonical link in the head is a hint that a 301 makes unnecessary.
#
# A named server block rather than host-matching inside the main one. One rule
# of nginx's that this file learned the hard way (DECISIONS 148): `server_name _`
# does NOT make a block the default — with no `default_server` marked, nginx
# routes every unmatched Host to the FIRST block in the file. That was this one,
# so heykettle.com itself fell into the 301 below and redirected to itself
# forever. The `default_server` flag on the main block's listen line is what
# routes the real domain correctly; this block catches only its named host.
# DECISIONS 201/212 — the ONE log line this server writes, and exactly what
# is in it. The weekly summary needs a date, a path and a status; it does not
# need, and must never be handed, an address or a user agent. So the format is
# defined by subtraction from nginx's `combined`: no $remote_addr, no
# $http_user_agent, no $http_referer, and $uri rather than $request so no
# query string rides along either. The privacy guarantee is made HERE, by the
# format, rather than downstream by a counter that promises to look away —
# there is no IP in the stream for anything to leak.
log_format kettle_counts '$time_iso8601 $status $uri';

server {
    listen 8080;
    server_name kettle-site.fly.dev;
    access_log off;

    # Not redirected: Fly's health checking and anything else that asks this
    # machine whether it is alive should get an answer from this machine, not a
    # 301 to a different one. fly.toml configures no HTTP check today, so this
    # is a guard against the check somebody adds later reporting the redirect
    # as a failure.
    location /healthz {
        add_header Content-Type application/json;
        return 200 '{"ok":true}';
    }

    location / {
        return 301 https://heykettle.com$request_uri;
    }
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # The blog (DECISIONS 174) is the first directory-shaped content here, so
    # the index module's add-a-trailing-slash 301 fires for the first time —
    # and by default nginx writes that Location absolute, from ITS OWN view:
    # `http://<host>:8080/blog/`. Behind Fly's TLS proxy that is the wrong
    # scheme and a port nobody can reach. `off` makes the Location relative
    # (`/blog/`), which the browser resolves against the https origin it is
    # already on. Validated against a real nginx 1.24 (2026-08-26), same
    # discipline as DECISIONS 168: with this line the redirect is relative;
    # without it the real binary emits the :8080 absolute form.
    absolute_redirect off;

    # Counted, not remembered (DECISIONS 201/212). This was `access_log off`
    # for as long as nothing counted anything; the weekly summary needs a
    # stream to count, so the server writes the three-field `kettle_counts`
    # line above to stdout, where the counter sidecar reads it, tallies it and
    # drops it. Nothing is written to disk, in this container or anywhere: the
    # line exists for the microseconds between nginx emitting it and the
    # counter bucketing it. The habit the old comment described is intact —
    # a request line is still never REMEMBERED — and what changed is that a
    # count of them now survives, which is the whole of what 201 permits.
    access_log /dev/stdout kettle_counts;

    # The DECISIONS 112 caching contract, ported from the webapp. Nothing
    # without a content hash in its name may be cached without revalidation;
    # everything with one is immutable for a year. The stakes are lower than
    # the webapp's white-screen (a stale landing page renders, wrongly), but
    # the six photographs live at stable names — hero-morning.webp stays
    # hero-morning.webp across reshoots — so a lifetime here would pin old
    # imagery and old copy to returning browsers for as long as it lasted.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Everything else is unhashed by name: the prerendered shell, the
    # photographs, privacy.html. `no-cache` means revalidate-before-use —
    # nginx serves ETags, so an unchanged photograph costs a 304, not a
    # re-download. Unknown paths are 404s: this is a document, not an app,
    # and it has no routes to fall back for.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location /healthz {
        add_header Content-Type application/json;
        return 200 '{"ok":true}';
    }
}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kettle notices when your parents' normal routine doesn't happen, and asks them first, before anyone worries."
    />
    <link rel="canonical" href="https://heykettle.com/" />
    <!-- The favicon set (Asana 1217835128977059): every raster is a crop of
         the hero's own kettle drawing (scripts/make-favicons.py); the SVG is
         the hand-simplified glyph for the sizes the hobnail texture cannot
         survive. All local, all unhashed, all under the DECISIONS 112
         revalidate rule like every other stable-name asset. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The share card: the kettle alone on the site's ground. Absolute URL
         because scrapers resolve nothing; heykettle.com is this page's own
         canonical origin, not a foreign one. Deliberately no og:title or
         og:description - scrapers fall back to the <title> and the meta
         description above, so the card carries only strings that already
         exist rather than a second copy surface. -->
    <meta property="og:image" content="https://heykettle.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- DECISIONS 171: "HeyKettle" is the formal public name on legal-ish
         surfaces (title, footer, privacy); "Kettle" stays the wordmark. -->
    <title>HeyKettle — Know the day started normally.</title>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
